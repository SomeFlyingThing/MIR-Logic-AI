[package]
name = "mir-logic"
version = "0.1.0"
edition = "2024"
description = "Experimental semantic CFG extraction and logic-bug analysis for Rust MIR"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
toml = "0.9"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"

